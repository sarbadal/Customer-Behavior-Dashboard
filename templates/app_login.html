{% extends "base.html" %}

{% block body_content %}
<main style="min-height: 100vh; display: grid; place-items: center; padding: 24px;">
    <section style="width: 100%; max-width: 420px; background: rgba(255,255,255,0.92); border-radius: 14px; padding: 24px; box-shadow: 0 14px 30px rgba(0,0,0,0.12);">
        <h1 style="margin: 0 0 8px;">App Access</h1>
        <p style="margin: 0 0 18px; color: #3b4b5b;">Enter app password to continue.</p>

        {% if error_message %}
            <p style="margin: 0 0 12px; color: #9f2d2d;">{{ error_message }}</p>
        {% endif %}

        <form method="post" action="{{ url_for('app_login') }}">
            <input type="hidden" name="next" value="{{ next_url }}">
            <label for="app-password" style="display: block; margin-bottom: 8px; font-weight: 600;">Password</label>
            <input id="app-password" name="password" type="password" autocomplete="current-password" required
                style="width: 100%; padding: 10px 12px; border: 1px solid #cfd8df; border-radius: 8px;">
            <button type="submit"
                style="margin-top: 14px; width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; background: #102a43; color: #fff; font-weight: 600; cursor: pointer;">
                Unlock
            </button>
        </form>
    </section>
</main>
{% endblock %}
