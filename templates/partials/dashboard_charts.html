<section id="insights" class="chart-grid">
    {% if ui_config.charts %}
        {% for chart in ui_config.charts %}
            <article class="chart-card{% if chart.wide %} wide{% endif %}">
                <h3>{{ chart.title }}</h3>
                <canvas id="{{ chart.canvas_id }}"></canvas>
            </article>
        {% endfor %}
    {% else %}
        <article class="chart-card wide">
            <h3>No charts enabled</h3>
            <p>Enable charts in config/dashboard.yaml to visualize dashboard data.</p>
        </article>
    {% endif %}
</section>
