{% extends "base.html" %}

{% block head_extra %}
	<style>
		.loading-page {
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding-top: 40px;
			padding-bottom: 40px;
		}

		.loading-panel {
			width: min(560px, 100%);
			background: rgba(255, 255, 255, 0.82);
			border: 1px solid rgba(22, 36, 45, 0.12);
			border-radius: 14px;
			box-shadow: var(--shadow-soft);
			padding: 28px;
			text-align: center;
			animation: rise 500ms ease-out;
		}

		.loading-panel h1 {
			margin: 14px 0 8px;
			font-size: clamp(1.35rem, 1.2rem + 1vw, 1.9rem);
		}

		.loading-panel p {
			margin: 0;
			color: var(--text-muted);
		}

		.spinner {
			width: 56px;
			height: 56px;
			margin: 0 auto;
			border: 5px solid rgba(22, 36, 45, 0.12);
			border-top-color: var(--blue);
			border-radius: 50%;
			animation: loading-spin 1s linear infinite;
		}

		.loading-meta {
			margin-top: 14px;
			font-family: "IBM Plex Mono", monospace;
			font-size: 0.84rem;
			color: var(--text-muted);
		}

		@keyframes loading-spin {
			to {
				transform: rotate(360deg);
			}
		}
	</style>
{% endblock %}

{% block body_content %}
	<div class="aurora"></div>
	<main class="container loading-page">
		<section
			class="loading-panel"
			aria-live="polite"
			aria-busy="true"
			data-wake-status-url="{{ url_for('wake_status') }}"
			data-dashboard-url="{{ dashboard_url | default(url_for('dashboard')) }}"
		>
			<div class="spinner" aria-hidden="true"></div>
			<h1>Preparing your dashboard...</h1>
			<p>Please wait while the database starts.</p>
			<p class="loading-meta" id="loading-status">Checking service status every 5 seconds.</p>
		</section>
	</main>
{% endblock %}

{% block scripts %}
	<script>
		const panel = document.querySelector(".loading-panel");
		const wakeStatusUrl = panel?.dataset.wakeStatusUrl || "/wake-status";
		const dashboardUrl = panel?.dataset.dashboardUrl || "/";
		const statusEl = document.getElementById("loading-status");
		let pollTimerId = null;

		async function checkStatus() {
			try {
				const response = await fetch(wakeStatusUrl, { cache: "no-store" });
				if (!response.ok) {
					throw new Error("Unexpected status code");
				}

				const data = await response.json();
				if (data.state === "READY") {
					window.location.replace(dashboardUrl);
					return;
				}

				if (data.state === "STOPED") {
					statusEl.textContent = "Database is stopped. Triggering wake-up and waiting for READY...";
					return;
				}

				if (data.state === "WAKING") {
					const elapsed = Number(data.elapsed_seconds || 0);
					const timeout = Number(data.timeout_seconds || 600);
					statusEl.textContent = `Database is waking up (${elapsed}s / ${timeout}s). Retrying...`;
					return;
				}

				if (data.state === "TIMEOUT") {
					statusEl.textContent = "Database wake-up timed out after 10 minutes. Please retry.";
					if (pollTimerId) {
						window.clearInterval(pollTimerId);
					}
					return;
				}

				statusEl.textContent = "Service is waking up. Retrying shortly...";
			} catch (error) {
				statusEl.textContent = "Connection issue while checking status. Retrying...";
			}
		}

		checkStatus();
		pollTimerId = setInterval(checkStatus, 5000);
	</script>
{% endblock %}
